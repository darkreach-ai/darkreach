# Docker Compose template for darkreach operator nodes
#
# Runs an operator node that connects to a coordinator, claims work blocks,
# runs prime searches, and reports results. The node authenticates using
# credentials from ~/.darkreach/config.toml or environment variables.
#
# Prerequisites:
#   1. Register with a coordinator: darkreach register --server https://api.darkreach.ai --username you --email you@example.com
#   2. Copy ~/.darkreach/config.toml into the config volume, OR set env vars below.
#
# Usage:
#   docker compose -f docker-compose.operator.yml up -d
#   docker compose -f docker-compose.operator.yml logs -f
#   docker compose -f docker-compose.operator.yml down
#
# Environment variables (set in .env or export before running):
#   DARKREACH_SERVER     - Coordinator URL (e.g. https://api.darkreach.ai)
#   DARKREACH_API_KEY    - Your operator API key
#   DARKREACH_USERNAME   - Your operator username
#   DATABASE_URL         - PostgreSQL connection string

services:
  node:
    image: ghcr.io/darkreach-ai/darkreach-node:latest
    build:
      context: .
      dockerfile: Dockerfile.node
    # Default CMD is "run" (operator daemon mode).
    # Override for direct work block mode:
    #   command: ["work", "--search-job-id", "42"]
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env or environment}
      DARKREACH_SERVER: ${DARKREACH_SERVER:-https://api.darkreach.ai}
      DARKREACH_API_KEY: ${DARKREACH_API_KEY:-}
      DARKREACH_USERNAME: ${DARKREACH_USERNAME:-}
      DARKREACH_LOG_FORMAT: json
    volumes:
      # Mount operator config (generated by `darkreach register`)
      - ${HOME:-.}/.darkreach:/root/.darkreach:ro
      # Checkpoint persistence across restarts
      - node-checkpoints:/app
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 4G
    healthcheck:
      test: ["CMD-SHELL", "pgrep -x darkreach || exit 1"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"

volumes:
  node-checkpoints:
